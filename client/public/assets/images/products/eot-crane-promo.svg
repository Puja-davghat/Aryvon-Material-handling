<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 620" role="img" aria-labelledby="title description">
  <title id="title">ARYVON EOT Crane</title>
  <desc id="description">A double-girder overhead travelling crane in an industrial facility with key product benefits.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052446"/>
      <stop offset="1" stop-color="#010d1c"/>
    </linearGradient>
    <linearGradient id="photoFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#031a31"/>
      <stop offset=".48" stop-color="#031a31" stop-opacity=".76"/>
      <stop offset="1" stop-color="#031a31" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".68" stop-color="#031a31" stop-opacity="0"/>
      <stop offset="1" stop-color="#031a31" stop-opacity=".85"/>
    </linearGradient>
    <clipPath id="photoClip">
      <path d="M105 45h335v575H105z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="440" height="620" fill="url(#background)"/>
  <g clip-path="url(#photoClip)">
    <image href="/assets/images/products/eot-double-girder-real.png" x="60" y="55" width="570" height="570" preserveAspectRatio="xMidYMid slice"/>
    <rect x="60" y="45" width="380" height="575" fill="url(#photoFade)"/>
    <rect x="60" y="45" width="380" height="575" fill="url(#bottomFade)"/>
  </g>
  <path d="M0 0h440v8H0z" fill="#fc6c04"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="39" fill="#fc6c04" font-size="12" font-weight="700" letter-spacing="2">ARYVON</text>
    <text x="28" y="57" fill="#c5d4e3" font-size="9" letter-spacing="1.2">MATERIAL HANDLING SOLUTIONS</text>
    <text x="28" y="126" fill="#fff" font-size="37" font-weight="700" filter="url(#shadow)">EOT</text>
    <text x="28" y="166" fill="#fff" font-size="37" font-weight="700" filter="url(#shadow)">Crane</text>
    <rect x="28" y="184" width="42" height="4" rx="2" fill="#fc6c04"/>
    <text x="28" y="218" fill="#fff" font-size="17" font-weight="700">Double-girder power.</text>
    <text x="28" y="241" fill="#fff" font-size="17" font-weight="700">Heavy-duty precision.</text>
    <g fill="#e3edf7" font-size="13" font-weight="600">
      <g transform="translate(28 296)">
        <circle cx="12" cy="0" r="12" fill="#fc6c04"/>
        <path d="M5-5h14v3H5zM8-2v3M16-2v3M12 1v5q0 3 3 3" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="4">Powerful lifting</text>
      </g>
      <g transform="translate(28 350)">
        <circle cx="12" cy="0" r="12" fill="#fc6c04"/>
        <path d="M5-4h14v3H5zM7-1v7M17-1v7M5 6h14" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="4">Smooth travel</text>
      </g>
      <g transform="translate(28 404)">
        <circle cx="12" cy="0" r="12" fill="#fc6c04"/>
        <path d="M5-4h14v3H5zM7-1v7M17-1v7M5 6h14M12-1v4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="4">Twin-girder design</text>
      </g>
      <g transform="translate(28 458)">
        <circle cx="12" cy="0" r="12" fill="#fc6c04"/>
        <path d="M12-7 14-2 19 0 14 2 12 7 10 2 5 0l5-2z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
        <text x="34" y="4">Built for industry</text>
      </g>
    </g>
    <path d="M28 568h384" stroke="#fc6c04" stroke-opacity=".65"/>
    <text x="28" y="593" fill="#c5d4e3" font-size="10" font-weight="700" letter-spacing="1.5">ENGINEERED FOR INDUSTRY</text>
  </g>
</svg>
