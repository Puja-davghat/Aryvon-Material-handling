        <h1>Vertical Reciprocating Conveyor</h1>
        <p>“Move your goods between floors with ease.”</p>
        <p>Industrial goods lifts engineered for reliable vertical movement of pallets, materials, and goods between floor levels — with enclosed safety cages and structural steel masts.</p>
        <h3>VRC Goods Lift with Enclosed Safety Cage</h3>
        <p>Heavy-duty structural steel mast with interlocked landing doors and multi-level floor access</p>
        <h2>KEY ENGINEERING &amp; SAFETY FEATURES</h2>
        <ul>
        <li>Engineered for pallets, heavy totes, and bulk materials between floor levels</li>
        <li>Fully enclosed safety wire mesh cage with electrical interlocks</li>
        <li>Electro-mechanical or hydraulic hoisting with fail-safe velocity fuses</li>
        <li>Push-button control stations at every landing with emergency stop</li>
        <li>Custom platform dimensions and carriage configurations to fit existing shafts or open floor voids</li>
        <li>Low maintenance guide columns with self-lubricating roller bearings</li>
        </ul>
        <p>Every ARYVON Vertical Reciprocating Conveyor is custom manufactured to your plant's specific payload capacity, lift height, and floor configuration. Standard lead time: 3 - 5 Weeks.</p>
        <p>QUOTATION INCLUDES:</p>
        <ul>
        <li>Free Technical Site Evaluation &amp; Layout Engineering</li>
        <li>Complete Manufacturing, Inspection &amp; Factory Load Testing</li>
        <li>On-site Erection, Commissioning &amp; Operator Training</li>
        </ul>
        <h2>TECHNICAL SPECIFICATIONS</h2>
        <p><strong>Load Capacity</strong></p>
        <p>500 kg to 5,000 kg (custom configurations available)</p>
        <p><strong>Travel Height</strong></p>
        <p>Up to 18 meters (G+1 to G+4 levels)</p>
        <p><strong>Lifting Speed</strong></p>
        <p>0.15 m/s to 0.35 m/s (variable via VFD)</p>
        <p><strong>Platform Dimensions</strong></p>
        <p>Standard 1,500 x 1,500 mm up to 3,000 x 3,000 mm</p>
        <p><strong>Mast Construction</strong></p>
        <p>Heavy-duty ISMC channel structural steel framework</p>
        <p><strong>Drive Mechanism</strong></p>
        <p>Hydraulic cylinder with wire-rope multiplier or motorized chain drive</p>
        <p><strong>Power Supply</strong></p>
        <p>415V AC, 3 Phase, 50 Hz</p>
        <p><strong>Safety Interlocks</strong></p>
        <p>Limit switches, mechanical anti-drop catches &amp; door interlocks</p>
        <h3>Have specific dimensions or shaft requirements?</h3>
        <p>Speak directly with an ARYVON application engineer to review your site drawings and calculate exact structural requirements.</p>
        <h2>Available VRC Types &amp; Configurations</h2>
        <p>Choose the model configuration best suited to your load handling and floor layout.</p>
        <h3>Single Mast VRC Goods Lift</h3>
        <p>Compact vertical conveyor designed for loads up to 1,500 kg where floor space is at a premium. Perfect for mezzanine floors and parts storage.</p>
        <h3>Dual Mast Heavy-Duty VRC</h3>
        <p>Heavy structural twin-column lift engineered for multi-pallet transfer, heavy dies, and high-throughput industrial facilities.</p>
