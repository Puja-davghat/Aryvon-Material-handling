        <h1>Conveyor</h1>
        <p>“Keep Your Operations Moving.”</p>
        <p>Robust industrial conveyor systems for continuous, automated movement of goods, components, and materials across production lines and distribution facilities.</p>
        <h3>Motorized Powered Roller Conveyor</h3>
        <p>Precision steel roller bed designed for continuous carton, box, and tote transport across packaging lines</p>
        <h2>KEY ENGINEERING &amp; SAFETY FEATURES</h2>
        <ul>
        <li>Built exactly to client reference designs for both Roller Conveyor and Chain Conveyor configurations</li>
        <li>Roller conveyor available in Motorized Drive Roller (powered) and heavy gravity accumulation designs</li>
        <li>Chain conveyor engineered with twin or triple industrial roller chain tracks for rugged pallet transit</li>
        <li>Structural steel frames powder coated or painted in industrial safety blue and safety yellow guards</li>
        <li>Variable Frequency Drive (VFD) for precision speed matching with upstream and downstream lines</li>
        <li>Low friction sealed precision bearings ensuring whisper-quiet continuous operation and extended lifespan</li>
        </ul>
        <p>Every ARYVON Conveyor is custom manufactured to your plant's specific payload capacity, lift height, and floor configuration. Standard lead time: 2 - 4 Weeks.</p>
        <p>QUOTATION INCLUDES:</p>
        <ul>
        <li>Free Technical Site Evaluation &amp; Layout Engineering</li>
        <li>Complete Manufacturing, Inspection &amp; Factory Load Testing</li>
        <li>On-site Erection, Commissioning &amp; Operator Training</li>
        </ul>
        <h2>TECHNICAL SPECIFICATIONS</h2>
        <p><strong>Conveyor Types</strong></p>
        <p>Powered Roller Conveyor, Gravity Roller Bed, Multi-Strand Chain Conveyor</p>
        <p><strong>Frame Construction</strong></p>
        <p>Heavy-duty laser-cut and formed structural steel channel frame</p>
        <p><strong>Roller Specifications</strong></p>
        <p>Zinc-plated or stainless steel rollers, 50 mm to 89 mm diameter, spring-loaded axles</p>
        <p><strong>Chain Specifications</strong></p>
        <p>Simplex or duplex high-tensile industrial roller chain on ultra-high molecular wear strips</p>
        <p><strong>Load Capacity</strong></p>
        <p>Up to 2,500 kg per meter (Chain) / up to 500 kg per roller (Heavy Roller Bed)</p>
        <p><strong>Conveyor Speed</strong></p>
        <p>Variable 5 to 30 meters/min with VFD speed control</p>
        <p><strong>Drive Unit</strong></p>
        <p>Inline helical geared motor with high-efficiency IE3 rating</p>
        <p><strong>Control Sensors</strong></p>
        <p>Integrated photoelectric retro-reflective sensors for zero pressure accumulation (ZPA)</p>
        <h3>Have specific dimensions or shaft requirements?</h3>
        <p>Speak directly with an ARYVON application engineer to review your site drawings and calculate exact structural requirements.</p>
        <h2>Available Conveyor Types &amp; Configurations</h2>
        <p>Choose the model configuration best suited to your load handling and floor layout.</p>
        <h3>Roller Conveyor</h3>
        <p>Industrial roller bed conveyor with heavy-gauge steel frame — available as powered (motorized drive roller) and gravity-feed configurations for box, tote, and pallet movement.</p>
        <h3>Chain Conveyor</h3>
        <p>Heavy-duty chain-driven conveyor with clearly visible industrial chain tracks and a sturdy steel supporting frame — ideal for conveying heavy pallets, dies, and assemblies.</p>
