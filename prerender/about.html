        <h1>About</h1>
        <p>Dedicated material handling solutions for industrial operations — focused on safety, reliability, and practical engineering.</p>
        <h2>Material Handling Solutions Engineered for Industry</h2>
        <p>ARYVON provides material handling equipment and solutions tailored to industrial operational requirements. We focus exclusively on four core product categories — Vertical Reciprocating Conveyors, Scissor Lifts, EOT Cranes, and Conveyor Systems.</p>
        <p>Our approach is direct and practical: we work with your operations team to understand the exact requirements of your facility, and then we recommend, configure, and supply equipment that resolves the actual handling challenges you face.</p>
        <p>We prioritize reliable, proven technology over speculative solutions — backing every system with transparent specifications and accessible technical support.</p>

        <h3>Operational Efficiency</h3>
