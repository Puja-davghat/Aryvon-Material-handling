        <h1>EOT Crane</h1>
        <p>“Reliable Lifting. Precise Movement.”</p>
        <p>Electric Overhead Travelling cranes engineered for heavy lifting across manufacturing bays, fabrication shops, and logistics handling areas.</p>
        <h3>Single Girder EOT Overhead Crane</h3>
        <p>Single box-section bridge girder with underslung motorized wire rope electric hoist</p>
        <h2>KEY ENGINEERING &amp; SAFETY FEATURES</h2>
        <ul>
        <li>Fabricated box-type or rolled section girders designed as per IS 807 and IS 3177 standards</li>
        <li>Precision wire rope electric hoist with hardened alloy steel gears and dual braking systems</li>
        <li>Smooth variable speed cross-travel and long-travel via Variable Frequency Drives (VFD)</li>
        <li>Dual control options: Ergonomic pendant pushbutton and wireless radio remote control</li>
        <li>End carriages with forged alloy steel wheels mounted on anti-friction spherical roller bearings</li>
        <li>Overload protection limit switch and cross-travel rotary limit switches for complete operator safety</li>
        </ul>
        <p>Every ARYVON EOT Crane is custom manufactured to your plant's specific payload capacity, lift height, and floor configuration. Standard lead time: 4 - 6 Weeks.</p>
        <p>QUOTATION INCLUDES:</p>
        <ul>
        <li>Free Technical Site Evaluation &amp; Layout Engineering</li>

        <li>On-site Erection, Commissioning &amp; Operator Training</li>
        </ul>

        <p><strong>Lifting Capacity</strong></p>
        <p>1 Ton to 50 Tons (Single Girder: 1T-15T, Double Girder: 5T-50T)</p>

        <p>6 meters to 32 meters (custom designed for factory bays)</p>
        <p><strong>Lifting Height</strong></p>
        <p>6 meters to 24 meters</p>
        <p><strong>Operating Duty</strong></p>
        <p>Class II (Medium), Class III (Heavy), Class IV (Extra Heavy Duty)</p>
        <p><strong>Design Standards</strong></p>
        <p>Compliant with IS 3177 / IS 807 / IS 4137</p>
        <p><strong>Hoist Type</strong></p>
        <p>Electric wire rope hoist with rotary limit switch and fail-safe electromagnetic brake</p>
        <p><strong>Control Mode</strong></p>
        <p>Wireless Radio Remote + Independent Pushbutton Pendant backup</p>
        <p><strong>Power Supply</strong></p>
        <p>415V AC, 3 Phase, 50 Hz with Shrouded DSL busbar system</p>

        <h3>Single Girder Crane</h3>
